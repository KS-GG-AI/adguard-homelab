<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" fill="none" role="img">
  <defs>
    <!-- Deep Homelab Dark Background Gradient -->
    <linearGradient id="topo-bg" x1="0" y1="0" x2="1100" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0e1424"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>

    <!-- Node Pod Deep Gradient -->
    <linearGradient id="pod-grad" x1="0" y1="0" x2="0" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111728"/>
      <stop offset="100%" stop-color="#090d18"/>
    </linearGradient>

    <!-- Soft shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <!-- Subtle Glow filter for LEDs -->
    <filter id="led-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Base Frame -->
  <rect width="1100" height="720" rx="16" fill="url(#topo-bg)" stroke="#1e293b" stroke-width="1.2"/>

  <!-- Top Title Header -->
  <text x="40" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="800">Arquitectura de Red Homelab y Topología de Pods Aislados</text>
  <text x="40" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Segmentación Doble NIC · Conmutación Dedicada 2.5G · Cero Acoplamiento DNS</text>

  <!-- SECTION 1: EXTERNAL NETWORK (WAN) -->
  <g transform="translate(40, 95)">
    <rect width="1020" height="90" rx="12" fill="#0d111d" stroke="#252f48" stroke-width="1.2" filter="url(#shadow)"/>
    
    <!-- Tag Badge -->
    <rect x="18" y="16" width="144" height="24" rx="6" fill="#181e33" stroke="#313d66" stroke-width="1"/>
    <circle cx="28" cy="28" r="3.5" fill="#818cf8" filter="url(#led-glow)"/>
    <text x="38" y="32" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">RED EXTERNA WAN</text>

    <!-- Description -->
    <text x="18" y="62" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">Gateway ISP y Resolutores Cifrados Upstream</text>
    <text x="18" y="79" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Gateway: 192.168.1.1 · Solicitudes Paralelas · Caché Optimista</text>

    <!-- Upstream Resolver Cards (Muted Slate Backgrounds) -->
    <g transform="translate(540, 24)">
      <rect x="0" y="0" width="150" height="42" rx="8" fill="#13182b" stroke="#252f4a" stroke-width="1"/>
      <text x="14" y="18" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">Cloudflare DoH</text>
      <text x="14" y="34" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="700">1.1.1.1:443</text>
    </g>
    <g transform="translate(700, 24)">
      <rect x="0" y="0" width="145" height="42" rx="8" fill="#13182b" stroke="#252f4a" stroke-width="1"/>
      <text x="14" y="18" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="600">Quad9 DoT</text>
      <text x="14" y="34" fill="#e2e8f0" font-family="sans-serif" font-size="11.5" font-weight="700">9.9.9.9:853</text>
    </g>
    <g transform="translate(855, 24)">
