<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" fill="none" role="img" aria-labelledby="topoTitle topoDesc">
  <title id="topoTitle">AdGuard Home Multi-Node Network Topology</title>
  <desc id="topoDesc">External WAN, 2.5G Switch Hub, and 4 Standalone Proxmox Pods architecture</desc>
  <defs>
    <linearGradient id="topo-bg" x1="0" y1="0" x2="1100" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pod-grad" x1="0" y1="0" x2="0" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="agh-grad" x1="0" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="720" rx="16" fill="url(#topo-bg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Title -->
  <text x="40" y="44" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Homelab Network Architecture &amp; Standalone Pod Topology</text>
  <text x="40" y="68" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Dual-NIC Segmentation · 2.5Gbps Dedicated Switching · Zero Cross-Node DNS Coupling</text>

  <!-- SECTION 1: EXTERNAL NETWORK (WAN) -->
  <g transform="translate(40, 95)">
    <rect width="1020" height="90" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="18" y="16" width="130" height="24" rx="6" fill="#4338ca"/>
    <text x="28" y="32" fill="#e0e7ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">EXTERNAL WAN</text>

    <text x="18" y="62" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">ISP Gateway &amp; Encrypted Upstream Resolvers</text>
    <text x="18" y="79" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Gateway: 192.168.1.1 · Parallel Requests · Optimistic Cache</text>

    <!-- Upstream Badges -->
    <g transform="translate(540, 24)">
      <rect x="0" y="0" width="150" height="42" rx="8" fill="#312e81" stroke="#818cf8"/>
      <text x="14" y="18" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Cloudflare DoH</text>
      <text x="14" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">1.1.1.1:443</text>
    </g>
    <g transform="translate(700, 24)">
      <rect x="0" y="0" width="145" height="42" rx="8" fill="#312e81" stroke="#818cf8"/>
      <text x="14" y="18" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Quad9 DoT</text>
      <text x="14" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">9.9.9.9:853</text>
    </g>
    <g transform="translate(855, 24)">
      <rect x="0" y="0" width="150" height="42" rx="8" fill="#312e81" stroke="#818cf8"/>
      <text x="14" y="18" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Google DoH</text>
      <text x="14" y="34" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">8.8.8.8:443</text>
    </g>
  </g>

  <!-- Connective Trunk Lines to Switch -->
  <line x1="550" y1="185" x2="550" y2="215" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="4 4"/>

  <!-- SECTION 2: 2.5G SWITCH HUB (BACKBONE) -->
  <g transform="translate(40, 215)">
    <rect width="1020" height="52" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="28" cy="26" r="6" fill="#38bdf8"/>
    <text x="44" y="32" fill="#f0f9ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">2.5Gbps High-Speed Switch Hub (Physical Backbone Interconnect)</text>
    <rect x="680" y="13" width="150" height="26" rx="6" fill="#0369a1"/>
    <text x="690" y="30" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Dual-NIC: vmbr0 (WAN)</text>
    <rect x="840" y="13" width="165" height="26" rx="6" fill="#075985"/>
    <text x="850" y="30" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Dual-NIC: vmbr1 (2.5G LAN)</text>
  </g>

  <!-- Trunk Lines from Switch to 4 Pods -->
  <line x1="167" y1="267" x2="167" y2="300" stroke="#38bdf8" stroke-width="2"/>
  <line x1="422" y1="267" x2="422" y2="300" stroke="#38bdf8" stroke-width="2"/>
  <line x1="677" y1="267" x2="677" y2="300" stroke="#38bdf8" stroke-width="2"/>
  <line x1="932" y1="267" x2="932" y2="300" stroke="#38bdf8" stroke-width="2"/>

  <!-- SECTION 3: 4 PHYSICAL NODES (STANDALONE PODS) -->

  <!-- NODE 1 (Detailed Highlighted Pod) -->
  <g transform="translate(40, 300)">
    <rect width="245" height="380" rx="12" fill="url(#pod-grad)" stroke="#0ea5e9" stroke-width="1.8" filter="url(#shadow)"/>
    <!-- Node Header -->
    <rect x="0" y="0" width="245" height="36" rx="12" fill="#0284c7"/>
    <text x="14" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">Node 1: myu1 (10.0.1.1)</text>

    <!-- AdGuard Home Appliance VMID 3000 -->
    <g transform="translate(12, 48)">
      <rect width="221" height="150" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <rect x="8" y="8" width="205" height="22" rx="4" fill="#0369a1"/>
      <text x="14" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">VM 3000: Adguard-Home</text>
      <text x="14" y="46" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">IP: 10.0.1.2</text>
      
      <!-- Services -->
      <text x="14" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">🔒 HTTP/2 Web UI: <tspan fill="#f1f5f9">Port 443</tspan></text>
      <text x="14" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">⚡ HTTP/3 DoQ: <tspan fill="#f1f5f9">Port 853 UDP</tspan></text>
      <text x="14" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">🛡️ ByeDPI: <tspan fill="#f1f5f9">1080</tspan> · PAC: <tspan fill="#f1f5f9">8088</tspan></text>
      <text x="14" y="114" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">🚀 ZRAM (zstd) + BBR</text>
      <text x="14" y="130" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">✓ 20-Year SAN SSL (2046)</text>
    </g>

    <!-- Local Guest VMs -->
    <g transform="translate(12, 210)">
      <rect width="221" height="110" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="10" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">GUEST VMS (10.0.1.0/24)</text>
      <text x="10" y="38" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• win10-ltsc01 (10.0.1.10)</text>
      <text x="10" y="54" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• debian-dev01 (10.0.1.11)</text>
      <text x="10" y="70" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• mail01 (10.0.1.12)</text>
      <text x="10" y="86" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">• storage01 (In dev)</text>
      <text x="10" y="102" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">Primary DNS: 10.0.1.2 (0ms)</text>
    </g>

    <!-- Failover Footer -->
    <rect x="12" y="330" width="221" height="38" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
    <text x="20" y="346" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">FAST DNS FAILOVER (1s)</text>
    <text x="20" y="360" fill="#f0fdf4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Fallback to 1.1.1.1 if VM 3000 stops</text>
  </g>

  <!-- NODE 2 -->
  <g transform="translate(295, 300)">
    <rect width="245" height="380" rx="12" fill="url(#pod-grad)" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="245" height="36" rx="12" fill="#334155"/>
    <text x="14" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">Node 2: myu2 (10.0.2.1)</text>

    <g transform="translate(12, 48)">
      <rect width="221" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <rect x="8" y="8" width="205" height="22" rx="4" fill="#1e293b"/>
      <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">VM 3000: Adguard-Home</text>
      <text x="14" y="46" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">IP: 10.0.2.2</text>
      <text x="14" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">🔒 HTTP/2: Port 443</text>
      <text x="14" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">⚡ HTTP/3 DoQ: Port 853 UDP</text>
      <text x="14" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">🛡️ ByeDPI + PAC 8088</text>
      <text x="14" y="114" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">🚀 ZRAM + TCP BBR</text>
      <text x="14" y="130" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">✓ 20-Year SAN SSL (2046)</text>
    </g>

    <g transform="translate(12, 210)">
      <rect width="221" height="110" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="10" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">GUEST VMS (10.0.2.0/24)</text>
      <text x="10" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Independent Local VMs</text>
      <text x="10" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Strict Isolation from Node 1</text>
      <text x="10" y="102" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">Primary DNS: 10.0.2.2 (0ms)</text>
    </g>

    <rect x="12" y="330" width="221" height="38" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
    <text x="20" y="346" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">FAST DNS FAILOVER (1s)</text>
    <text x="20" y="360" fill="#f0fdf4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Fallback to 1.1.1.1 if VM 3000 stops</text>
  </g>

  <!-- NODE 3 -->
  <g transform="translate(550, 300)">
    <rect width="245" height="380" rx="12" fill="url(#pod-grad)" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="245" height="36" rx="12" fill="#334155"/>
    <text x="14" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">Node 3: myu3 (10.0.3.1)</text>

    <g transform="translate(12, 48)">
      <rect width="221" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <rect x="8" y="8" width="205" height="22" rx="4" fill="#1e293b"/>
      <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">VM 3000: Adguard-Home</text>
      <text x="14" y="46" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">IP: 10.0.3.2</text>
      <text x="14" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">🔒 HTTP/2: Port 443</text>
      <text x="14" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">⚡ HTTP/3 DoQ: Port 853 UDP</text>
      <text x="14" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">🛡️ ByeDPI + PAC 8088</text>
      <text x="14" y="114" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">🚀 ZRAM + TCP BBR</text>
      <text x="14" y="130" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">✓ 20-Year SAN SSL (2046)</text>
    </g>

    <g transform="translate(12, 210)">
      <rect width="221" height="110" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="10" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">GUEST VMS (10.0.3.0/24)</text>
      <text x="10" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Independent Local VMs</text>
      <text x="10" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Strict Isolation from Node 1</text>
      <text x="10" y="102" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">Primary DNS: 10.0.3.2 (0ms)</text>
    </g>

    <rect x="12" y="330" width="221" height="38" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
    <text x="20" y="346" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">FAST DNS FAILOVER (1s)</text>
    <text x="20" y="360" fill="#f0fdf4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Fallback to 1.1.1.1 if VM 3000 stops</text>
  </g>

  <!-- NODE 4 -->
  <g transform="translate(805, 300)">
    <rect width="245" height="380" rx="12" fill="url(#pod-grad)" stroke="#334155" stroke-width="1.2" filter="url(#shadow)"/>
    <rect x="0" y="0" width="245" height="36" rx="12" fill="#334155"/>
    <text x="14" y="23" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">Node 4: myu4 (10.0.4.1)</text>

    <g transform="translate(12, 48)">
      <rect width="221" height="150" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <rect x="8" y="8" width="205" height="22" rx="4" fill="#1e293b"/>
      <text x="14" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">VM 3000: Adguard-Home</text>
      <text x="14" y="46" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">IP: 10.0.4.2</text>
      <text x="14" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">🔒 HTTP/2: Port 443</text>
      <text x="14" y="82" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">⚡ HTTP/3 DoQ: Port 853 UDP</text>
      <text x="14" y="98" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">🛡️ ByeDPI + PAC 8088</text>
      <text x="14" y="114" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">🚀 ZRAM + TCP BBR</text>
      <text x="14" y="130" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">✓ 20-Year SAN SSL (2046)</text>
    </g>

    <g transform="translate(12, 210)">
      <rect width="221" height="110" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="10" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">GUEST VMS (10.0.4.0/24)</text>
      <text x="10" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Independent Local VMs</text>
      <text x="10" y="65" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Strict Isolation from Node 1</text>
      <text x="10" y="102" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">Primary DNS: 10.0.4.2 (0ms)</text>
    </g>

    <rect x="12" y="330" width="221" height="38" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
    <text x="20" y="346" fill="#86efac" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">FAST DNS FAILOVER (1s)</text>
    <text x="20" y="360" fill="#f0fdf4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Fallback to 1.1.1.1 if VM 3000 stops</text>
  </g>
</svg>