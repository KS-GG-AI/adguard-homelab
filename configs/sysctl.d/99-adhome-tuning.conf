# ====================================================================
# High-Performance Linux Kernel Tuning for AdGuard Home & DNS Cluster
# ====================================================================

# ZRAM and memory management tuning
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# TCP BBR congestion control and Fair Queueing
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# UDP & TCP socket buffer sizing for high-throughput DNS traffic
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000
net.core.rmem_default = 1048576
net.core.wmem_default = 1048576

# Maximum open file descriptors
fs.file-max = 2097152
